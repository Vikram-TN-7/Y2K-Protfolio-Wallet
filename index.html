    /* ============================================================
       RESET & BASE – Dark Glassy Professional
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0b0b14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #e8ecf0;
    }
    .wallet-card {
      max-width: 1100px;
      width: 100%;
      background: rgba(20, 22, 32, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      padding: 2.2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      transition: box-shadow 0.2s ease;
    }
    .wallet-card:hover {
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f0f3f8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .logo h1 .accent {
      color: #6a8cff;
      font-weight: 300;
    }
    .logo h1 .click-target {
      cursor: pointer;
      padding: 0 4px;
      border-radius: 4px;
      background: linear-gradient(145deg, #f0f3f8, #aab4d0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
      transition: 0.15s;
    }
    .logo h1 .click-target:hover {
      background: linear-gradient(145deg, #6a8cff, #b388ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transform: scale(1.02);
    }
    .logo h1 .dot {
      color: rgba(255,255,255,0.3);
      font-weight: 300;
    }
    .logo h1 .wallet-text {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    .logo small {
      display: block;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }
    .stats {
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
      background: rgba(255,255,255,0.04);
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .stats strong {
      color: rgba(255,255,255,0.7);
    }
    .edit-indicator {
      font-size: 0.65rem;
      color: rgba(106,255,140,0.6);
      background: rgba(106,255,140,0.08);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      border: 1px solid rgba(106,255,140,0.1);
      margin-left: 0.5rem;
      animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .sync-status {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      margin-left: 0.8rem;
      background: rgba(255,255,255,0.04);
      padding: 0.15rem 0.6rem;
      border-radius: 40px;
    }
    .sync-status.synced {
      color: rgba(106,255,140,0.5);
      border: 1px solid rgba(106,255,140,0.08);
    }
    .sync-status.saving {
      color: rgba(255,200,100,0.5);
      border: 1px solid rgba(255,200,100,0.08);
    }

    /* ============================================================
       PORTFOLIO GRID
       ============================================================ */

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin: 1.5rem 0 1.8rem;
    }
    .card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 1.8rem;
      padding: 1.4rem 1.2rem 1.2rem;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      color: #e8ecf0;
      position: relative;
    }

      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);

    .card:nth-child(6n+3) { border-left: 4px solid #4dd0a0; }
    .card:nth-child(6n+4) { border-left: 4px solid #b388ff; }
    .card:nth-child(6n+5) { border-left: 4px solid #ff7a6b; }
    .card:nth-child(6n+6) { border-left: 4px solid #4dd0e1; }

      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      align-self: flex-start;
    }

      display: flex;
      gap: 0.4rem;
      margin-top: 8px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 8px;
    }
    .card-actions button {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      font-size: 0.65rem;
      cursor: pointer;
      transition: 0.15s;
      backdrop-filter: blur(2px);

    .card-actions button:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-color: rgba(255,255,255,0.15);
    }

      background: rgba(255,80,80,0.2);
      border-color: rgba(255,80,80,0.3);
      color: #ff7a6b;
    }

      align-items: center;

      transition: 0.15s;
      border-bottom: 1px solid transparent;
      width: fit-content;
      margin-top: 4px;
    }
    .card-link:hover {
      color: #a8c0ff;
      border-bottom-color: #6a8cff;

      background: rgba(255,255,255,0.02);

      transition: 0.2s;

      padding-top: 1.2rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;

      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: 0.15s;
      margin-left: 0.5rem;

      color: #fff;
      border-bottom-color: #6a8cff;

       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      .wallet-card { padding: 1.5rem; border-radius: 2rem; }

      .portfolio-grid { gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

    }
    @media (max-width: 420px) {

       ANIMATIONS
       ============================================================ */
    .card {

    .card:nth-child(2) { animation-delay: 0.04s; }
    .card:nth-child(3) { animation-delay: 0.06s; }
    .card:nth-child(4) { animation-delay: 0.08s; }
    .card:nth-child(5) { animation-delay: 0.10s; }
    .card:nth-child(6) { animation-delay: 0.12s; }

      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;

      0% { opacity: 0; }
      100% { opacity: 1; }

    .password-modal {
      background: rgba(20,22,32,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 2rem;
      padding: 2.5rem 2.8rem;

      width: 90%;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      text-align: center;

    .password-modal h2 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #f0f3f8;
    }
    .password-modal p {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      margin-bottom: 1.8rem;
    }
    .password-modal input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #e8ecf0;
      font-size: 1rem;
      outline: none;
      transition: 0.15s;
      margin-bottom: 1rem;
    }
    .password-modal input:focus {
      border-color: #6a8cff;
      box-shadow: 0 0 0 3px rgba(106,140,255,0.15);
      background: rgba(255,255,255,0.06);
    }
    .password-modal .error {
      color: #ff7a6b;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      min-height: 1.2rem;
    }
    .password-modal .btn-group {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
    }
    .password-modal .btn-group button {
      padding: 0.6rem 2rem;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }
    .password-modal .btn-group button:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-color: rgba(255,255,255,0.15);
    }
    .password-modal .btn-group .btn-primary {
      background: rgba(106,140,255,0.2);
      border-color: rgba(106,140,255,0.3);
      color: #c8d6ff;
    }
    .password-modal .btn-group .btn-primary:hover {
      background: rgba(106,140,255,0.3);
      border-color: #6a8cff;
    }

    /* ============================================================
       TOAST NOTIFICATIONS
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,22,32,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.8rem 2rem;
      border-radius: 60px;
      border: 1px solid rgba(255,80,80,0.2);
      color: #ff7a6b;
      font-size: 0.9rem;
      z-index: 2000;
      animation: slideUp 0.3s ease, fadeOut 0.3s ease 2.5s forwards;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      font-weight: 500;
      text-align: center;
      max-width: 90%;
    }
    .toast-success {
      border-color: rgba(106,255,140,0.2);
      color: #6aff8c;
    }
    @keyframes slideUp {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }

    /* ============================================================
       LOADING FALLBACK
       ============================================================ */
    .loading-fallback {
      text-align: center;
      padding: 3rem;
      color: rgba(255,255,255,0.5);
    }
    .loading-fallback .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #6a8cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
